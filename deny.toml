[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # "Unmaintained" notice (not a vulnerability) for a compile-time proc macro reached only
    # through Tauri's Linux GTK bindings (gtk-rs 0.18 -> glib-macros). No upgrade exists until
    # Tauri moves to newer gtk-rs; revisit on Tauri updates.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time dependency of Tauri's GTK stack; no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # BSD-style permissive license of libbzip2, used by libbz2-rs-sys (pure-Rust bzip2).
    "bzip2-1.0.6",
]
# Mozilla CA root data used by ureq: HTTPS downloads of crawler IP lists (octopuson-net) and
# libduckdb-sys' build script. Scoped to this crate instead of allowed globally.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # BSD Zero Clause (public-domain-like, no conditions) of the quoted-printable encoder used by
    # lettre for the web platform's report e-mails. Scoped to this crate.
    { crate = "quoted_printable", allow = ["0BSD"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Exact upstream security-fix revision is pinned in Cargo.toml and Cargo.lock (ADR 0014).
allow-git = ["https://github.com/jmcnamara/rust_xlsxwriter"]
