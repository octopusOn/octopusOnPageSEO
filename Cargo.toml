[workspace]
resolver = "3"
members = ["crates/*", "apps/octopuson-log-cli", "apps/octopuson-crawler-cli", "apps/octopuson-index-cli", "apps/octopuson-serp-cli", "apps/octopuson-keywords-cli", "apps/log-analyser/src-tauri", "apps/seo-crawler/src-tauri", "apps/index-checker/src-tauri", "apps/serp-checker/src-tauri", "apps/seo-keyword-research/src-tauri", "xtask"]
default-members = ["crates/*", "apps/octopuson-log-cli", "apps/octopuson-crawler-cli", "apps/octopuson-index-cli", "apps/octopuson-serp-cli", "apps/octopuson-keywords-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/octopusOn/octopusOnPageSEO"
homepage = "https://octopuson.com"
authors = ["octopusSEO"]
publish = false

[workspace.dependencies]
# Internal crates
octopuson-core = { path = "crates/octopuson-core" }
octopuson-logparse = { path = "crates/octopuson-logparse" }
octopuson-url = { path = "crates/octopuson-url" }
octopuson-botverify = { path = "crates/octopuson-botverify" }
octopuson-query = { path = "crates/octopuson-query" }
octopuson-analytics = { path = "crates/octopuson-analytics" }
octopuson-store = { path = "crates/octopuson-store" }
octopuson-report = { path = "crates/octopuson-report" }
octopuson-log-app = { path = "crates/octopuson-log-app" }
octopuson-net = { path = "crates/octopuson-net" }
octopuson-geo = { path = "crates/octopuson-geo" }
octopuson-html = { path = "crates/octopuson-html" }
octopuson-audit = { path = "crates/octopuson-audit" }
octopuson-crawl = { path = "crates/octopuson-crawl" }
octopuson-crawl-store = { path = "crates/octopuson-crawl-store" }
octopuson-spider-app = { path = "crates/octopuson-spider-app" }
octopuson-opportunities = { path = "crates/octopuson-opportunities" }
octopuson-finder = { path = "crates/octopuson-finder" }

octopuson-render = { path = "crates/octopuson-render" }
octopuson-serp = { path = "crates/octopuson-serp" }
octopuson-text = { path = "crates/octopuson-text" }
octopuson-domain-intel = { path = "crates/octopuson-domain-intel" }
octopuson-serp-score = { path = "crates/octopuson-serp-score" }
octopuson-keyword-sources = { path = "crates/octopuson-keyword-sources" }
octopuson-keywords = { path = "crates/octopuson-keywords" }
octopuson-kw-app = { path = "crates/octopuson-kw-app" }
octopuson-kw-store = { path = "crates/octopuson-kw-store" }
octopuson-oauth = { path = "crates/octopuson-oauth" }
octopuson-secrets = { path = "crates/octopuson-secrets" }
octopuson-cloud = { path = "crates/octopuson-cloud" }
octopuson-serp-store = { path = "crates/octopuson-serp-store" }
octopuson-serp-app = { path = "crates/octopuson-serp-app" }

# External crates
anyhow = "1"
base64 = "0.23"
blake3 = "1.8"
bzip2 = "0.6"
directories = "6"
dns-lookup = "4"
duckdb = { version = "1.10506.1", features = ["bundled", "parquet", "appender-arrow"] }
ego-tree = "0.11"
encoding_rs = "0.8"
rayon = "1.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ctrlc = "3.5"
criterion = "0.8"
flate2 = "1.1"
getrandom = "0.3"
quick-xml = "0.42.0"
insta = "1.49"
# OS credential stores; platform backends are enabled per target by the crates using it.
keyring = { version = "3.6", default-features = false }
memchr = "2.8"
miette = { version = "7", features = ["fancy"] }
proptest = "1.12"
psl = "2.1"
regex = "1.13"
rust-stemmers = "1.2"
scraper = { version = "0.27", default-features = false }
# Published 0.99.1 requires vulnerable zip 8; pin the official ZIP 9 fix until a release includes it.
rust_xlsxwriter = { git = "https://github.com/jmcnamara/rust_xlsxwriter", rev = "ade0a017439d169b2a9c4848fe1cb66919c0ca3d", default-features = false, features = ["constant_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
sha2 = "0.10"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = "3.4"
url = "2.5"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true

# Bundled DuckDB C++ debug symbols otherwise add several GiB per build variant.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.test.package.libduckdb-sys]
debug = false
