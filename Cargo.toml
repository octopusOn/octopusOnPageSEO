[workspace]
resolver = "3"
members = ["crates/*", "apps/snx-log", "apps/desktop/src-tauri", "xtask"]
default-members = ["crates/*", "apps/snx-log"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sabri-kocabas/octopusseo-log-analyser"
homepage = "https://octopusseo.com"
authors = ["octopusSEO"]
publish = false

[workspace.dependencies]
# Internal crates
seonexus-core = { path = "crates/seonexus-core" }
seonexus-logparse = { path = "crates/seonexus-logparse" }
seonexus-url = { path = "crates/seonexus-url" }
seonexus-botverify = { path = "crates/seonexus-botverify" }
seonexus-query = { path = "crates/seonexus-query" }
seonexus-analytics = { path = "crates/seonexus-analytics" }
seonexus-store = { path = "crates/seonexus-store" }
seonexus-report = { path = "crates/seonexus-report" }
seonexus-log-app = { path = "crates/seonexus-log-app" }
seonexus-net = { path = "crates/seonexus-net" }
seonexus-geo = { path = "crates/seonexus-geo" }

# External crates
anyhow = "1"
blake3 = "1.8"
bzip2 = "0.6"
directories = "6"
dns-lookup = "4"
duckdb = { version = "1.10506.0", features = ["bundled", "parquet", "appender-arrow"] }
rayon = "1.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
criterion = "0.8"
flate2 = "1.1"
insta = "1.49"
memchr = "2.8"
miette = { version = "7", features = ["fancy"] }
proptest = "1.12"
regex = "1.13"
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["constant_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "3.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
