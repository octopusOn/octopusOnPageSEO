[package]
name = "octopuson-log-desktop"
description = "OctopusOn Log Analyser desktop application (Tauri shell around the log-app use-cases)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "octopuson-log-desktop"

[lib]
name = "octopuson_log_desktop_lib"
# Desktop only: Tauri's mobile targets would need staticlib/cdylib as well.
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
octopuson-cloud.workspace = true
octopuson-log-app.workspace = true
octopuson-net.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
