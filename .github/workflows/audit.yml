name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml"]
  workflow_dispatch:

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --workspace check advisories
