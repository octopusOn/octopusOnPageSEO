name: Release

# Pushing a tag such as `v0.2.0` creates a draft GitHub release (notes from
# docs/releases/<version>.md), builds the desktop installers and CLI archives for every
# platform and attaches them to it. Publishing the draft makes the files appear on the website.
# Code signing and notarization are enabled by adding the Tauri secrets (see docs/release.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          [ -f "$notes" ] || { echo "Release notes for ${version} are missing" > /tmp/notes.md; notes=/tmp/notes.md; }
          # Reuse the release of a re-run; otherwise take the id from the create response (a
          # listing right after creating a draft may not include it yet).
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="octopusSEO Log Analyser ${version}" \
              -F body=@"$notes" -F draft=true --jq .id)
          fi
          test -n "$id"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.platform }})
    needs: draft
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Signs and notarizes when the Apple secrets exist; without them the app is signed ad hoc
      # (bundle.macOS.signingIdentity "-"). Empty values must not reach Tauri, which would
      # otherwise try to sign with an empty identity.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "${name}<<__VALUE__"; echo "${!name}"; echo "__VALUE__"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  cli:
    name: snx-log (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p snx-log --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="snx-log-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/snx-log.exe" "$name/"
            7z a "$name.zip" "$name"
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/snx-log" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
