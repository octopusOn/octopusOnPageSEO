name: Release

# Pushing a tag creates a draft GitHub release of one program, builds its desktop installers and
# CLI archives for every platform and attaches them to it. The tag is `<program>-v<version>`
# (apps/web/src/lib/products.json `tagPrefix`): `log-v0.2.0` the Log Analyser, `spider-v0.2.0`
# the SEO Crawler, `serp-v…` the SERP Checker, `keywords-v…` the SEO Keyword Research, `index-v…` the
# Index Checker, `platform-v…` the GEO-SEO Platform (which also gets its Linux web server, the
# archive scripts/deploy-platform.sh installs). `pnpm release <program>` (scripts/release.mjs) writes the English notes to
# docs/releases/<program>-<version>.md and makes the tag. Publishing the draft makes the files
# appear on the website. Code signing and notarization are enabled by adding the Tauri secrets
# (see docs/release.md).

on:
  push:
    tags: ["crawler-v*", "log-v*", "serp-v*", "keywords-v*", "index-v*", "platform-v*"]

permissions:
  contents: write

jobs:
  resolve:
    name: resolve product
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.product.outputs.name }}
      app: ${{ steps.product.outputs.app }}
      cli: ${{ steps.product.outputs.cli }}
      package: ${{ steps.product.outputs.package }}
      server: ${{ steps.product.outputs.server }}
      app_package: ${{ steps.product.outputs.app_package }}
      repo: ${{ steps.product.outputs.repo }}
      repo_owner: ${{ steps.product.outputs.repo_owner }}
      repo_name: ${{ steps.product.outputs.repo_name }}
      tag: ${{ steps.product.outputs.tag }}
      version: ${{ steps.product.outputs.version }}
      notes: ${{ steps.product.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: product
        env:
          HAS_PROGRAMS_TOKEN: ${{ secrets.PROGRAMS_TOKEN != '' && '1' || '' }}
        run: |
          # The longest tag prefix followed by a version names the product.
          product=$(jq -c --arg tag "$GITHUB_REF_NAME" '
            map(select(. as $p | ($tag | startswith($p.tagPrefix))
              and ($tag[($p.tagPrefix | length):] | test("^[0-9]"))))
            | max_by(.tagPrefix | length) // empty' apps/web/src/lib/products.json)
          if [ -z "$product" ]; then
            echo "::error::${GITHUB_REF_NAME} is not the tag of a product in apps/web/src/lib/products.json"
            exit 1
          fi
          prefix=$(jq -r .tagPrefix <<<"$product")
          version="${GITHUB_REF_NAME#"$prefix"}"
          app=$(jq -r .app <<<"$product")
          conf_version=$(jq -r .version "${app}/src-tauri/tauri.conf.json")
          if [ "$conf_version" != "$version" ]; then
            echo "::error::${app}/src-tauri/tauri.conf.json is version ${conf_version}, the tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          {
            echo "name=$(jq -r .name <<<"$product")"
            echo "app=${app}"
            echo "cli=$(jq -r .cli <<<"$product")"
            echo "package=$(jq -r .package <<<"$product")"
            echo "server=$(jq -r '.server // ""' <<<"$product")"
            echo "app_package=$(jq -r '.id' <<<"$product")"
            # The program's own GitHub project gets the release (tag v<version>) when the
            # PROGRAMS_TOKEN secret can write to it; otherwise this repository keeps it.
            if [ -n "${HAS_PROGRAMS_TOKEN}" ]; then
              repo=$(jq -r .repo <<<"$product")
              echo "tag=v${version}"
            else
              repo="${GITHUB_REPOSITORY}"
              echo "tag=${GITHUB_REF_NAME}"
            fi
            echo "repo=${repo}"
            echo "repo_owner=${repo%%/*}"
            echo "repo_name=${repo#*/}"
            echo "version=${version}"
            echo "notes=docs/releases/${prefix%v}${version}.md"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: draft release
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.PROGRAMS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRODUCT: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NOTES: ${{ needs.resolve.outputs.notes }}
        run: |
          notes="$NOTES"
          [ -f "$notes" ] || { echo "Release notes for ${PRODUCT} ${VERSION} are missing" > /tmp/notes.md; notes=/tmp/notes.md; }
          # Reuse the release of a re-run; otherwise take the id from the create response (a
          # listing right after creating a draft may not include it yet).
          id=$(gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            prerelease=false
            case "$VERSION" in *-*) prerelease=true ;; esac
            id=$(gh api -X POST "repos/${REPO}/releases" \
              -f tag_name="$TAG" -f name="${PRODUCT} ${VERSION}" \
              -F body=@"$notes" -F draft=true -F prerelease="$prerelease" --jq .id)
          fi
          test -n "$id"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.platform }})
    needs: [resolve, draft]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Signs and notarizes when the Apple secrets exist; without them the app is signed ad hoc
      # (bundle.macOS.signingIdentity "-"). Empty values must not reach Tauri, which would
      # otherwise try to sign with an empty identity.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "${name}<<__VALUE__"; echo "${!name}"; echo "__VALUE__"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PROGRAMS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          owner: ${{ needs.resolve.outputs.repo_owner }}
          repo: ${{ needs.resolve.outputs.repo_name }}
          projectPath: ${{ needs.resolve.outputs.app }}
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  cli:
    name: ${{ needs.resolve.outputs.cli }} (${{ matrix.target }})
    needs: [resolve, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ${{ needs.resolve.outputs.package }} --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROGRAMS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CLI: ${{ needs.resolve.outputs.cli }}
        run: |
          name="${CLI}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${CLI}.exe" "$name/"
            7z a "$name.zip" "$name"
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/${CLI}" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          gh release upload "$TAG" "$archive" --repo "$REPO" --clobber

  server:
    name: web server (x86_64-unknown-linux-gnu)
    needs: [resolve, draft]
    if: needs.resolve.outputs.server != ''
    # The oldest supported Ubuntu, so the binary runs on its glibc and every newer one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@octopusseo/${{ needs.resolve.outputs.app_package }}" build
      - run: cargo build --release --locked -p ${{ needs.resolve.outputs.server }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.PROGRAMS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SERVER: ${{ needs.resolve.outputs.server }}
          APP: ${{ needs.resolve.outputs.app }}
        run: |
          # The binary and the built interface; scripts/deploy-platform.sh unpacks it into a new
          # release folder on the server and checks it against the .sha256 file.
          name="${SERVER}-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/release/${SERVER}" "$name/"
          cp -R "${APP}/dist" "$name/ui"
          cp LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --repo "$REPO" --clobber
