# OctopusOn SEO account portal (my.octopuson.com, apps/portal) and credits gateway
# (api.octopuson.com, apps/gateway). Not CloudPanel sites: both run as systemd services of the
# octopuson site user (deploy/account/*.service). Installed as
# /etc/nginx/sites-enabled/octopuson-account.conf; see docs/cloud.md, "Deploying".

# Cloudflare sits in front, so the visitor's address is in CF-Connecting-IP. It is trusted only
# on connections that come from Cloudflare (https://www.cloudflare.com/ips/, checked 2026-10-18);
# the server's nginx.conf takes X-Real-IP from anyone, hence $realip_remote_addr.
geo $realip_remote_addr $octopuson_via_cloudflare {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}

map "$octopuson_via_cloudflare:$http_cf_connecting_ip" $octopuson_client_ip {
  "~^1:(?<visitor>.+)$" $visitor;
  default $realip_remote_addr;
}

# No query strings and no referrers: they can carry sign-in links, device codes and search terms.
log_format octopuson_account '$octopuson_client_ip [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream octopuson_portal {
  server 127.0.0.1:3030;
  keepalive 8;
}

upstream octopuson_gateway {
  server 127.0.0.1:8787;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/ssl-certificates/octopuson.com.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/octopuson.com.key;
  server_name my.octopuson.com;

  access_log /home/octopuson/logs/nginx/my-access.log octopuson_account;
  error_log /home/octopuson/logs/nginx/my-error.log;

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  client_max_body_size 2m;

  location / {
    proxy_pass http://octopuson_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $octopuson_client_ip;
    proxy_set_header X-Real-IP $octopuson_client_ip;
    proxy_redirect off;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/ssl-certificates/octopuson.com.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/octopuson.com.key;
  server_name api.octopuson.com;

  access_log /home/octopuson/logs/nginx/api-access.log octopuson_account;
  error_log /home/octopuson/logs/nginx/api-error.log;

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  # Connectors cap request bodies at max_body_kb themselves; this is the outer limit.
  client_max_body_size 2m;

  location / {
    proxy_pass http://octopuson_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $octopuson_client_ip;
    proxy_set_header X-Real-IP $octopuson_client_ip;
    proxy_redirect off;
    # Connector timeouts go up to 120 s; the gateway answers 504 itself before this.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
