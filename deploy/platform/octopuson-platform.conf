# OctopusOn GEO-SEO Platform (app.octopuson.com, apps/octopuson-platform-server). Not a CloudPanel
# site: it runs as the systemd service octopuson-platform (deploy/platform). Installed as
# /etc/nginx/sites-enabled/octopuson-platform.conf; see docs/platform.md, "Deploying".
#
# $octopuson_client_ip (the visitor's address behind Cloudflare) and the octopuson_account log
# format come from octopuson-account.conf in the same folder, which must stay installed.

upstream octopuson_platform {
  server 127.0.0.1:8796;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/ssl-certificates/octopuson.com.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/octopuson.com.key;
  server_name app.octopuson.com;

  # No query strings and no referrers: they carry sign-in codes and Google's answers.
  access_log /home/octopuson/logs/nginx/app-access.log octopuson_account;
  error_log /home/octopuson/logs/nginx/app-error.log;

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  # Report logos and long keyword lists; the server sets its own limits below this.
  client_max_body_size 4m;

  # Job progress, a long-lived event stream.
  location = /api/events {
    proxy_pass http://octopuson_platform;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $octopuson_client_ip;
    proxy_set_header X-Real-IP $octopuson_client_ip;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://octopuson_platform;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $octopuson_client_ip;
    proxy_set_header X-Real-IP $octopuson_client_ip;
    proxy_redirect off;
    # Paid questions and report PDFs can take a while; jobs report through /api/events.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
